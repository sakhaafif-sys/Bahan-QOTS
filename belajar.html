<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mari Belajar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="belajar.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Webpro</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#judul" aria-controls="judul" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="judul">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="#form">form</a></li>
                    <li class="nav-item"><a class="nav-link" href="#table">table</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-5">
    <div class="row justify-content-center mt-4">
        <!-- Sedikit diperlebar menjadi col-md-8 col-lg-6 col-xl-5 agar form lebih proporsional -->
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <div class="card shadow border-0">
                <div class="card-body p-4 p-md-5"> <!-- Padding diperbesar agar mirip referensi pertama -->
                    
                    <h3 class="text-center mb-4">Formulir Data diri</h3>
                    
                    <form>
                        <!-- Input Nama -->
                        <div class="mb-3">
                            <label for="name" class="form-label">Nama:</label>
                            <input type="text" class="form-control" id="name" name="nama" placeholder="Masukkan Nama Anda" required>
                        </div>
                        
                        <!-- Input Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email:</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="Masukkan Email Anda" required>
                        </div>
                        
                        <!-- Radio Button Fakultas -->
                        <div class="mb-3">
                            <label class="form-label d-block">Fakultas</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="FIF" name="Fakultas" value="FIF">
                                <label class="form-check-label" for="FIF">FIF</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="FRI" name="Fakultas" value="FRI">
                                <label class="form-check-label" for="FRI">FRI</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="FEB" name="Fakultas" value="FEB">
                                <label class="form-check-label" for="FEB">FEB</label>
                            </div>
                        </div>
                        
                        <!-- Dropdown Prodi -->
                        <div class="mb-3">
                            <label for="prodi" class="form-label">Prodi</label>
                            <select class="form-select" name="prodi" id="prodi">
                                <option value="" disabled selected>Pilih Program Studi</option>
                                <option value="S1 Teknologi Informasi">S1 Teknologi Informasi</option>
                                <option value="S1 Sistem Informasi">S1 Sistem Informasi</option>
                                <option value="S1 Administrasi Bisnis">S1 Administrasi Bisnis</option>
                            </select>
                        </div>
                        
                        <!-- Textarea Lainnya -->
                        <div class="mb-4">
                            <label for="Lainnya" class="form-label">Lainnya:</label>
                            <textarea class="form-control" id="Lainnya" name="Lainnya" rows="4" placeholder="Tuliskan keterangan lainnya..."></textarea>
                        </div>
                        
                        <!-- Tombol Submit -->
                        <!-- class w-100 membuatnya memenuhi lebar layar, py-2 menebalkan tombol -->
                        <button type="submit" class="btn btn-success w-100 py-2">Masuk</button>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</main>
        
</div>
    <class id="table"" >
                    <table border="1" cellpadding="10" cellspacing="0" class="table table-success table-striped table-hover">
                        <caption>Jadwal Kuliah</caption>
                        <thead cellspacing="10">
                            <tr>
                                <th id="Nama">Nama</th>
                                <th>Hari</th>
                                <th>Kelas</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Webpro</td>
                                <td>Sabtu</td>
                                <td>Cacuk</td>
                            </tr>
                            <tr>
                                <td>IoT</td>
                                <td>Selasa</td>
                                <td>Cacuk</td>
                            </tr>
                            <tr>
                                <td>UX</td>
                                <td>Rabu</td>
                                <td>Online</td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="3">Total Matkul = 3</td>
                            </tr>
                        </tfoot>
                    </table>
     </class>

    <footer class="bg-dark text-light py-3 mt-auto" id="kontak">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center text-center text-md-start">
      <span>&copy; 2026 Klub Web Developer</span>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
